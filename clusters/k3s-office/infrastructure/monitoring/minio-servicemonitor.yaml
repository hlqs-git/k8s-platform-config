apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio
  namespace: minio
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      monitoring: minio-prometheus

  endpoints:
  - port: api
    path: /minio/v2/metrics/cluster
    interval: 60s
    scrapeTimeout: 30s

    bearerTokenSecret:
      name: minio-prometheus-token
      key: token

    relabelings:
    - sourceLabels:
      - __meta_kubernetes_pod_name
      regex: minio-0
      action: keep
