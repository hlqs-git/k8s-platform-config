apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: metallb
  namespace: metallb-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: metallb
  podMetricsEndpoints:
  - port: metricshttps
    path: /metrics
    scheme: https
    interval: 60s
    scrapeTimeout: 30s
    authorization:
      type: Bearer
      credentials:
        name: metallb-prometheus-token
        key: token
    tlsConfig:
      insecureSkipVerify: true
