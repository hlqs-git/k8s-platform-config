apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: juicefs-mount
  namespace: kube-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: juicefs-mount
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 60s
    scrapeTimeout: 30s
