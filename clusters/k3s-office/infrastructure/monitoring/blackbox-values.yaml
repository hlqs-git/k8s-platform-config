config:
  modules:
    http_2xx:
      prober: http
      timeout: 10s
      http:
        preferred_ip_protocol: ip4
        follow_redirects: true

    tcp_connect:
      prober: tcp
      timeout: 10s

    icmp:
      prober: icmp
      timeout: 5s
      icmp:
        preferred_ip_protocol: ip4

    dns_harbor:
      prober: dns
      timeout: 5s
      dns:
        preferred_ip_protocol: ip4
        transport_protocol: udp
        query_name: hb.k3s.hlqs.top
        query_type: A
        valid_rcodes:
          - NOERROR

serviceMonitor:
  selfMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
    interval: 60s
    scrapeTimeout: 30s
