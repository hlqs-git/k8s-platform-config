apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-tcp
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: blackbox-tcp
  interval: 60s
  scrapeTimeout: 15s
  module: tcp_connect
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
      - 192.168.13.215:5432
