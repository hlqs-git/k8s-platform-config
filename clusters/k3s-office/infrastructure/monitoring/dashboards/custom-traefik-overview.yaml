apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-custom-traefik-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  custom-traefik-overview.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Traefik Up",
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "max(up{job=\"traefik-metrics\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  }
                }
              ],
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "stat",
          "title": "Request Rate",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(traefik_entrypoint_requests_total{entrypoint=~\"web|websecure\"}[$__rate_interval]))",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "5xx Rate",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(traefik_entrypoint_requests_total{entrypoint=~\"web|websecure\",code=~\"5..\"}[$__rate_interval])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 3
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Open Connections",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(traefik_open_connections{entrypoint=~\"web|websecure\"})",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "TLS Certificate Days Left",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "expr": "min((traefik_tls_certs_not_after - time()) / 86400)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name"
          }
        },
        {
          "type": "stat",
          "title": "Config Reload Success",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "targets": [
            {
              "expr": "max(traefik_config_last_reload_success > bool 0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "SUCCESS"
                    },
                    "0": {
                      "text": "FAILED"
                    }
                  }
                }
              ],
              "unit": "none"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "Requests by EntryPoint",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "expr": "sum by (entrypoint) (rate(traefik_entrypoint_requests_total{entrypoint=~\"web|websecure\"}[$__rate_interval]))",
              "legendFormat": "{{entrypoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "HTTP Status Code Rate",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "expr": "sum by (code) (rate(traefik_entrypoint_requests_total{entrypoint=~\"web|websecure\"}[$__rate_interval]))",
              "legendFormat": "{{code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "P95 Request Latency by EntryPoint",
          "id": 9,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, entrypoint) (rate(traefik_entrypoint_request_duration_seconds_bucket{entrypoint=~\"web|websecure\"}[$__rate_interval])))",
              "legendFormat": "{{entrypoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "EntryPoint Traffic",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "expr": "sum by (entrypoint) (rate(traefik_entrypoint_requests_bytes_total{entrypoint=~\"web|websecure\"}[$__rate_interval]))",
              "legendFormat": "IN {{entrypoint}}",
              "refId": "A"
            },
            {
              "expr": "sum by (entrypoint) (rate(traefik_entrypoint_responses_bytes_total{entrypoint=~\"web|websecure\"}[$__rate_interval]))",
              "legendFormat": "OUT {{entrypoint}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Request Rate by Backend Service",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "expr": "sum by (exported_service) (rate(traefik_service_requests_total[$__rate_interval]))",
              "legendFormat": "{{exported_service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "5xx Rate by Backend Service",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "targets": [
            {
              "expr": "sum by (exported_service) (rate(traefik_service_requests_total{code=~\"5..\"}[$__rate_interval])) or (sum by (exported_service) (rate(traefik_service_requests_total[$__rate_interval])) * 0)",
              "legendFormat": "{{exported_service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "P95 Latency by Backend Service",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 29
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, exported_service) (rate(traefik_service_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{exported_service}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Traffic by Backend Service",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 29
          },
          "targets": [
            {
              "expr": "sum by (exported_service) (rate(traefik_service_requests_bytes_total[$__rate_interval]))",
              "legendFormat": "IN {{exported_service}}",
              "refId": "A"
            },
            {
              "expr": "sum by (exported_service) (rate(traefik_service_responses_bytes_total[$__rate_interval]))",
              "legendFormat": "OUT {{exported_service}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Traefik Config Reload Rate",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 38
          },
          "targets": [
            {
              "expr": "rate(traefik_config_reloads_total[$__rate_interval])",
              "legendFormat": "reloads",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 41,
      "tags": [
        "custom",
        "traefik",
        "k3s"
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "label": "Prometheus",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Custom - Traefik Overview",
      "uid": "custom-traefik-overview",
      "version": 2
    }
